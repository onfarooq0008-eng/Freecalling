<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Video Call</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SCREEN 1: SET UP ===== -->
  <div id="screen-setup" class="screen active">
    <div class="setup-card">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 3.5v-11l-4 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <h1>Video Call</h1>
      <p class="subtitle">Enter your name and a call ID to connect. Share the same call ID with the other person.</p>

      <label class="field">
        <span>Your name</span>
        <input id="input-name" type="text" placeholder="e.g. Sam" maxlength="24" autocomplete="off" />
      </label>

      <label class="field">
        <span>Call ID</span>
        <div class="call-id-row">
          <input id="input-room" type="text" placeholder="e.g. sam-jordan" maxlength="40" autocomplete="off" />
          <button id="btn-generate" type="button" class="btn-ghost" title="Generate a random call ID">⟳</button>
        </div>
      </label>

      <button id="btn-join" class="btn-primary" type="button">Continue</button>
      <p id="setup-error" class="error-text"></p>
    </div>
  </div>

  <!-- ===== SCREEN 2: LOBBY (camera preview + call button) ===== -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-video-wrap">
      <video id="lobby-preview" autoplay playsinline muted></video>
      <div id="lobby-novideo" class="novideo-badge">Camera off</div>
    </div>
    <div class="lobby-panel">
      <p class="lobby-room-label">Call ID: <span id="lobby-room-id"></span></p>
      <div class="lobby-controls">
        <button id="lobby-toggle-mic" class="ctrl-btn active" title="Toggle microphone">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z" fill="currentColor"/></svg>
        </button>
        <button id="lobby-toggle-cam" class="ctrl-btn active" title="Toggle camera">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 3.5v-11l-4 3.5Z" fill="currentColor"/></svg>
        </button>
      </div>
      <button id="btn-start-call" class="btn-call" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.2c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8Z" fill="currentColor"/></svg>
        <span id="btn-start-call-label">Call</span>
      </button>
      <button id="btn-leave-lobby" class="btn-text" type="button">Back</button>
    </div>
  </div>

  <!-- ===== SCREEN 3: RINGING (outgoing) ===== -->
  <div id="screen-ringing" class="screen call-screen">
    <div class="ringing-center">
      <div class="avatar-ring">
        <div class="avatar-circle" id="ringing-avatar-initial">?</div>
      </div>
      <h2 id="ringing-name">Calling…</h2>
      <p class="ringing-status">Waiting for them to join the call ID</p>
      <p class="ringing-room">Call ID: <span id="ringing-room-id"></span></p>
    </div>
    <div class="call-bottom-bar">
      <button id="btn-cancel-call" class="ctrl-btn danger big" title="Cancel">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 9c-1.6 0-3.2.3-4.6.8-.4.2-.9 0-1.1-.4L5 6.9c-.2-.4-.1-.9.3-1.1C7.7 4.6 9.8 4 12 4s4.3.6 6.7 1.8c.4.2.5.7.3 1.1l-1.3 2.5c-.2.4-.7.6-1.1.4C15.2 9.3 13.6 9 12 9Zm0 3c1 0 1.9.1 2.8.4.4.1.6.5.5.9l-.6 2.7c-.1.4-.5.7-.9.6-.5-.1-1.1-.2-1.8-.2s-1.3.1-1.8.2c-.4.1-.8-.2-.9-.6l-.6-2.7c-.1-.4.1-.8.5-.9.9-.3 1.8-.4 2.8-.4Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== SCREEN 4: INCOMING CALL ===== -->
  <div id="screen-incoming" class="screen call-screen">
    <div class="ringing-center">
      <div class="avatar-ring pulse">
        <div class="avatar-circle" id="incoming-avatar-initial">?</div>
      </div>
      <h2 id="incoming-name">Someone</h2>
      <p class="ringing-status">Incoming video call…</p>
    </div>
    <div class="incoming-actions">
      <button id="btn-decline" class="ctrl-btn danger big" title="Decline">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 9c-1.6 0-3.2.3-4.6.8-.4.2-.9 0-1.1-.4L5 6.9c-.2-.4-.1-.9.3-1.1C7.7 4.6 9.8 4 12 4s4.3.6 6.7 1.8c.4.2.5.7.3 1.1l-1.3 2.5c-.2.4-.7.6-1.1.4C15.2 9.3 13.6 9 12 9Zm0 3c1 0 1.9.1 2.8.4.4.1.6.5.5.9l-.6 2.7c-.1.4-.5.7-.9.6-.5-.1-1.1-.2-1.8-.2s-1.3.1-1.8.2c-.4.1-.8-.2-.9-.6l-.6-2.7c-.1-.4.1-.8.5-.9.9-.3 1.8-.4 2.8-.4Z" fill="currentColor"/></svg>
      </button>
      <button id="btn-accept" class="ctrl-btn accept big" title="Accept">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.2c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== SCREEN 5: ACTIVE CALL ===== -->
  <div id="screen-active" class="screen call-screen active-call">
    <video id="remote-video" autoplay playsinline></video>
    <div id="remote-placeholder" class="remote-placeholder">
      <div class="avatar-circle lg" id="active-avatar-initial">?</div>
      <p id="active-peer-name">Connecting…</p>
    </div>

    <div class="call-topbar">
      <div class="call-peer-info">
        <span id="active-name-label">Connecting…</span>
        <span id="call-timer" class="call-timer">00:00</span>
      </div>
    </div>

    <video id="local-video" autoplay playsinline muted class="local-pip"></video>

    <div class="call-bottom-bar">
      <button id="active-toggle-mic" class="ctrl-btn active" title="Mute">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z" fill="currentColor"/></svg>
      </button>
      <button id="active-toggle-cam" class="ctrl-btn active" title="Turn off camera">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 3.5v-11l-4 3.5Z" fill="currentColor"/></svg>
      </button>
      <button id="active-switch-cam" class="ctrl-btn" title="Switch camera">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 7h3l1.5-2h1L14 7h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm5 3a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" fill="currentColor"/></svg>
      </button>
      <button id="btn-hangup" class="ctrl-btn danger big" title="End call">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 9c-1.6 0-3.2.3-4.6.8-.4.2-.9 0-1.1-.4L5 6.9c-.2-.4-.1-.9.3-1.1C7.7 4.6 9.8 4 12 4s4.3.6 6.7 1.8c.4.2.5.7.3 1.1l-1.3 2.5c-.2.4-.7.6-1.1.4C15.2 9.3 13.6 9 12 9Zm0 3c1 0 1.9.1 2.8.4.4.1.6.5.5.9l-.6 2.7c-.1.4-.5.7-.9.6-.5-.1-1.1-.2-1.8-.2s-1.3.1-1.8.2c-.4.1-.8-.2-.9-.6l-.6-2.7c-.1-.4.1-.8.5-.9.9-.3 1.8-.4 2.8-.4Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== SCREEN 6: CALL ENDED ===== -->
  <div id="screen-ended" class="screen">
    <div class="setup-card">
      <div class="brand-mark"><svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M12 9c-1.6 0-3.2.3-4.6.8-.4.2-.9 0-1.1-.4L5 6.9c-.2-.4-.1-.9.3-1.1C7.7 4.6 9.8 4 12 4s4.3.6 6.7 1.8c.4.2.5.7.3 1.1l-1.3 2.5c-.2.4-.7.6-1.1.4C15.2 9.3 13.6 9 12 9Zm0 3c1 0 1.9.1 2.8.4.4.1.6.5.5.9l-.6 2.7c-.1.4-.5.7-.9.6-.5-.1-1.1-.2-1.8-.2s-1.3.1-1.8.2c-.4.1-.8-.2-.9-.6l-.6-2.7c-.1-.4.1-.8.5-.9.9-.3 1.8-.4 2.8-.4Z" stroke="currentColor" stroke-width="1.6"/></svg></div>
      <h1>Call ended</h1>
      <p class="subtitle" id="ended-summary">The call has ended.</p>
      <button id="btn-back-to-lobby" class="btn-primary" type="button">Back to lobby</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
